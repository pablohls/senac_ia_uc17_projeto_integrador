[project]
name = "sonar"
version = "0.1.0"
description = "Mapeador de tendências em tecnologia (PLN + Deep Learning) — Projeto Integrador UC17 / SENAC"
authors = [{ name = "Equipe SONAR (UC17)" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<4.0"
# Dependências são resolvidas pelo Poetry a partir de [tool.poetry.dependencies].
dynamic = ["dependencies"]

[project.scripts]
sonar = "run_all:main"

[tool.poetry]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"

# --- Deep Learning (PyTorch) ---
# Uma única linha serve a toda a equipe: as wheels oficiais do PyPI já são
# específicas por plataforma e trazem a aceleração certa em cada uma.
#   Linux x86_64 : build CUDA 12.4 — o torch declara nvidia-cuda-runtime-cu12==12.4.127
#                  e nvidia-cublas-cu12==12.4.5.8 sob o marker
#                  'platform_system == "Linux" and platform_machine == "x86_64"'.
#                  É exatamente a mesma CUDA que o índice download.pytorch.org/whl/cu124
#                  entregava — a source explícita era redundante.
#   macOS arm64  : build com MPS/Metal (não existe wheel CUDA para darwin).
# Como as deps nvidia-* são marker-gated, o macOS não as baixa.
#
# Pin em ~2.6 para manter o dev no Mac e o pipeline na VM GPU na mesma versão upstream
# (mesma numérica, mesma API do sentence-transformers/BERTopic). Subir com cuidado.
torch = "~2.6"

# --- PLN / Embeddings ---
sentence-transformers = "^3.0"
bertopic = "^0.16"

# --- Dados / IO ---
pandas = "^2.2"
pyarrow = "^17.0"
numpy = "*"

# --- Séries temporais ---
statsmodels = "^0.14"

# --- Dashboard ---
streamlit = "^1.38"
plotly = "^5.22"
networkx = "^3.3"

# --- Config ---
pydantic = "^2.8"
pyyaml = "^6.0"

# --- Coleta ---
trafilatura = "^1.12"
lxml = "^5.2"
requests = "^2.32"
openai = "^2.44.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.6"

# NOTA: a source explícita "pytorch-cu124" (download.pytorch.org/whl/cu124) foi removida.
# Ela entregava a mesma CUDA 12.4 que as wheels do PyPI já trazem no Linux, mas publica
# apenas wheels linux/windows — o que quebrava `poetry install` em Apple Silicon e obrigava
# cada dev de Mac a manter um override local via `git update-index --skip-worktree`.
# Só volte a declará-la se o projeto precisar de um CUDA diferente do default do PyPI
# (ex.: cu118 para driver antigo, ou build cpu-only) — e, nesse caso, para todas as
# plataformas de uma vez, nunca via markers (o instalador do Poetry deduplica por nome
# de pacote e ignora o marker quando há duas entradas da mesma versão-base).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pycodestyle/pyflakes, I = isort (imports), UP = pyupgrade
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
